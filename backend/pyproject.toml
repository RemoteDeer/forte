[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forte-backend"
version = "0.1.0"
description = "Offline video analysis API for the ForteBank Datathon"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "opencv-python-headless>=4.11,<5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["backend", "backend.app"]
package-dir = {backend = ".", "backend.app" = "app"}

[tool.setuptools.package-data]
"backend.app" = ["rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
